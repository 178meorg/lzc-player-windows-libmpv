name: Build Windows Dependencies

on:
  workflow_dispatch:

jobs:
  build-ffmpeg:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            git
            make
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm

      - name: Build FFmpeg
        run: |
          ./scripts/build-ffmpeg.sh
      
      - name: Build FreeType
        shell: msys2 {0}
        run: |
          ./scripts/build-freetype.sh

      - name: Build FriBidi
        shell: msys2 {0}
        run: |
          ./scripts/build-fribidi.sh

      - name: Build HarfBuzz
        shell: msys2 {0}
        run: |
          ./scripts/build-harfbuzz.sh

      - name: Build libass
        shell: msys2 {0}
        run: |
          ./scripts/build-libass.sh