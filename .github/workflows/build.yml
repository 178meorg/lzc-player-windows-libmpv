name: Build mpv

# on:
#   push:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            curl
            zip
            wget
            tar
            xz
            pkgconf
            make
            cmake
            ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-jinja
            mingw-w64-x86_64-python-glad
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-cargo-c
            perl
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm

      - name: Check build tools
        shell: msys2 {0}
        run: |
          gcc --version
          cmake --version
          meson --version
          ninja --version
          pkg-config --version
          python --version
          rustc --version
          cargo --version

      - name: Build FreeType
        shell: msys2 {0}
        run: |
          ./scripts/build-freetype.sh

      - name: Build FriBidi
        shell: msys2 {0}
        run: |
          ./scripts/build-fribidi.sh

      - name: Build HarfBuzz
        shell: msys2 {0}
        run: |
          ./scripts/build-harfbuzz.sh

      - name: Build libass
        shell: msys2 {0}
        run: |
          ./scripts/build-libass.sh

      - name: Build zlib-ng
        run: ./scripts/build-zlib-ng.sh

      - name: Build zstd
        run: ./scripts/build-zstd.sh

      - name: Build bzip2
        run: ./scripts/build-bzip2.sh

      - name: Build lzo
        run: ./scripts/build-lzo.sh

      - name: Build xz
        run: ./scripts/build-xz.sh

      - name: Build OpenSSL
        run: ./scripts/build-openssl.sh

      - name: Build libiconv
        run: ./scripts/build-libiconv.sh

      - name: Build libxml2
        run: ./scripts/build-libxml2.sh

      - name: Build libarchive
        run: ./scripts/build-libarchive.sh
      
      - name: Build Vulkan-Headers
        run: ./scripts/build-vulkan-headers.sh

      - name: Build Vulkan-Loader
        run: ./scripts/build-vulkan-loader.sh

      - name: Build SPIRV-Cross
        run: ./scripts/build-spirv-cross.sh

      - name: Build SPIRV-Headers
        run: ./scripts/build-spirv-headers.sh

      - name: Build SPIRV-Tools
        run: ./scripts/build-spirv-tools.sh

      - name: Build glslang
        run: ./scripts/build-glslang.sh

      - name: Build shaderc
        run: ./scripts/build-shaderc.sh

      - name: Build LCMS2
        run: ./scripts/build-lcms2.sh

      - name: Build libdovi
        run: ./scripts/build-libdovi.sh

      - name: Build libplacebo
        run: ./scripts/build-libplacebo.sh

      - name: Build FFmpeg headers
        run: ./scripts/build-ffmpeg-headers.sh

      - name: Build FFmpeg extra dependencies
        run: ./scripts/build-ffmpeg-extra.sh

      - name: Build FFmpeg codec dependencies
        run: ./scripts/build-ffmpeg-codecs.sh

      - name: Build FFmpeg
        run: ./scripts/build-ffmpeg.sh
      
      - name: Build mpv
        run: ./scripts/build-mpv.sh

      - name: Upload libmpv package
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-windows-x86_64
          path: build/libmpv-windows-x86_64.zip
          if-no-files-found: error
