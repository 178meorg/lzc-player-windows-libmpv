name: Build Windows mpv

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            checkinstall \
            bison \
            flex \
            gettext \
            git \
            mercurial \
            subversion \
            ninja-build \
            gyp \
            cmake \
            meson \
            yasm \
            nasm \
            automake \
            pkgconf \
            libtool \
            libtool-bin \
            gcc-multilib \
            g++-multilib \
            clang \
            lld \
            libc++1 \
            libc++abi1 \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            libgcrypt-dev \
            gperf \
            ragel \
            texinfo \
            autopoint \
            re2c \
            asciidoc \
            docbook2x \
            unzip \
            p7zip-full \
            curl \
            ccache \
            python3-pip

          python3 -m pip install \
            meson \
            rst2pdf \
            mako \
            jsonschema

      - name: Clone mpv-winbuild-cmake
        run: |
          git clone \
            --depth=1 \
            https://github.com/shinchiro/mpv-winbuild-cmake.git \
            mpv-winbuild-cmake

      - name: Configure
        run: |
          cmake \
            -G Ninja \
            -B build \
            -S mpv-winbuild-cmake \
            -DTARGET_ARCH=x86_64-w64-mingw32 \
            -DCOMPILER_TOOLCHAIN=gcc

      - name: Show configuration
        run: |
          cmake --build build --target help | head -100